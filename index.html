<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saeed Al-Taweel | IT &amp; Network Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&amp;family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #08090d; --bg2: #0e1018; --card: #111420;
    --border: rgba(255,255,255,0.06);
    --accent: #00d4ff; --accent2: #0077ff; --accent3: #00ff9d;
    --text: #e8eaf0; --muted: #7a7f99; --heading: #ffffff;
    --gradient: linear-gradient(135deg, #00d4ff, #0077ff);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; line-height: 1.7; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 999; opacity: 0.4; }
  .grid-bg { position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(var(--accent-rgb),0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--accent-rgb),0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
  .orb { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0; }
  .orb-1 { width: 600px; height: 600px; background: rgba(var(--accent2-rgb),0.08); top: -200px; right: -200px; }
  .orb-2 { width: 400px; height: 400px; background: rgba(var(--accent-rgb),0.06); bottom: 20%; left: -150px; }

  /* NAV */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0 5%; display: flex; align-items: center; justify-content: space-between; height: 70px; background: rgba(var(--bg-rgb),0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); animation: fadeDown 0.8s ease both; }
  .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--heading); text-decoration: none; letter-spacing: -0.02em; }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--accent); }
  .nav-cta { padding: 0.5rem 1.4rem; background: var(--gradient); border: none; border-radius: 6px; color: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: opacity 0.2s, transform 0.2s; font-family: 'DM Sans', sans-serif; }
  .nav-cta:hover { opacity: 0.85; transform: translateY(-1px); }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--text); border-radius: 2px; }

  section { position: relative; z-index: 1; }

  /* HERO */
  #home { min-height: 100vh; display: flex; align-items: center; padding: 100px 5% 60px; }
  .hero-inner { max-width: 1100px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
  .hero-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.2); border-radius: 100px; padding: 0.35rem 1rem; font-size: 0.78rem; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 1.5rem; animation: fadeUp 0.8s 0.2s both; }
  .hero-title { font-family: 'Syne', sans-serif; font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; line-height: 1.1; color: var(--heading); letter-spacing: -0.03em; animation: fadeUp 0.8s 0.3s both; }
  .hero-title .accent { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero-sub { margin-top: 1.2rem; font-size: 1.05rem; color: var(--muted); font-weight: 300; max-width: 480px; animation: fadeUp 0.8s 0.4s both; }
  .hero-actions { margin-top: 2.5rem; display: flex; gap: 1rem; flex-wrap: wrap; animation: fadeUp 0.8s 0.5s both; }
  .btn-primary { padding: 0.8rem 2rem; background: var(--gradient); border: none; border-radius: 8px; color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; font-family: 'DM Sans', sans-serif; display: inline-flex; align-items: center; gap: 0.5rem; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(var(--accent2-rgb),0.3); }
  .btn-outline { padding: 0.8rem 2rem; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; font-weight: 500; cursor: pointer; text-decoration: none; transition: border-color 0.2s, color 0.2s; font-family: 'DM Sans', sans-serif; display: inline-flex; align-items: center; gap: 0.5rem; }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .hero-stats { display: flex; gap: 2.5rem; margin-top: 3rem; animation: fadeUp 0.8s 0.6s both; }
  .stat-number { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; color: var(--heading); line-height: 1; }
  .stat-number span { color: var(--accent); }
  .stat-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.3rem; }
  .hero-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; position: relative; overflow: hidden; animation: fadeUp 0.8s 0.4s both; }
  .hero-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--gradient); }
  .hero-card-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 1.2rem; }
  .hero-card h3 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--heading); }
  .hero-card > p { font-size: 0.9rem; color: var(--muted); margin-top: 0.3rem; }
  .hero-card-info { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.8rem; }
  .info-row { display: flex; align-items: center; gap: 0.8rem; font-size: 0.88rem; color: var(--text); }
  .info-row i { color: var(--accent); font-size: 0.85rem; width: 18px; }
  .availability { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1.5rem; padding: 0.4rem 1rem; background: rgba(var(--accent3-rgb),0.08); border: 1px solid rgba(var(--accent3-rgb),0.2); border-radius: 100px; font-size: 0.8rem; color: var(--accent3); }
  .dot { width: 7px; height: 7px; background: var(--accent3); border-radius: 50%; animation: pulse 2s infinite; }

  /* SECTION COMMON */
  .section-wrap { max-width: 1100px; margin: 0 auto; padding: 100px 5%; }
  .section-label { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.8rem; }
  .section-label::before { content: ''; width: 24px; height: 1px; background: var(--accent); }
  .section-title { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 3.5vw, 2.8rem); font-weight: 800; color: var(--heading); letter-spacing: -0.02em; line-height: 1.1; }
  .section-divider { width: 60px; height: 3px; background: var(--gradient); border-radius: 2px; margin-top: 1rem; }

  /* ABOUT */
  
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start; margin-top: 3.5rem; }
  .about-text p { color: var(--text); font-size: 1rem; line-height: 1.85; margin-bottom: 1.2rem; font-weight: 300; }
  .about-highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem; }
  .highlight-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; transition: border-color 0.2s, transform 0.2s; }
  .highlight-card:hover { border-color: rgba(var(--accent-rgb),0.3); transform: translateY(-2px); }
  .highlight-card i { color: var(--accent); font-size: 1.2rem; margin-bottom: 0.6rem; display: block; }
  .highlight-card strong { display: block; font-size: 0.9rem; color: var(--heading); margin-bottom: 0.2rem; }
  .highlight-card span { font-size: 0.8rem; color: var(--muted); }
  .about-info-list { display: flex; flex-direction: column; gap: 0.8rem; }
  .about-info-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; }
  .about-info-item .label { color: var(--muted); font-size: 0.82rem; }
  .about-info-item .value { color: var(--text); font-weight: 500; }
  .languages-wrap { margin-top: 2rem; }
  .languages-wrap h4 { font-family: 'Syne', sans-serif; color: var(--heading); margin-bottom: 1rem; font-size: 0.95rem; }
  .lang-item { margin-bottom: 1rem; }
  .lang-name { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--text); margin-bottom: 0.4rem; }
  .lang-bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .lang-fill { height: 100%; border-radius: 4px; background: var(--gradient); }

  /* EXPERIENCE */
  
  .timeline { margin-top: 3.5rem; position: relative; }
  .timeline::before { content: ''; position: absolute; left: 20px; top: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, var(--accent), transparent); }
  .timeline-item { position: relative; padding-left: 60px; margin-bottom: 3rem; }
  .timeline-dot { position: absolute; left: 10px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(var(--accent2-rgb),0.4); }
  .timeline-dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .timeline-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.8rem; transition: border-color 0.2s, transform 0.2s; }
  .timeline-card:hover { border-color: rgba(var(--accent-rgb),0.25); transform: translateX(4px); }
  .tc-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
  .tc-role { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--heading); }
  .tc-company { color: var(--accent); font-size: 0.9rem; font-weight: 500; }
  .tc-meta { display: flex; gap: 1rem; flex-wrap: wrap; }
  .tc-date, .tc-location { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; }
  .tc-desc { margin-top: 1rem; }
  .tc-desc li { font-size: 0.9rem; color: var(--text); font-weight: 300; padding: 0.3rem 0 0.3rem 1rem; position: relative; list-style: none; }
  .tc-desc li::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  /* SKILLS */
  
  .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3.5rem; }
  .skill-category { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.8rem; transition: transform 0.2s, border-color 0.2s; }
  .skill-category:hover { transform: translateY(-4px); border-color: rgba(var(--accent-rgb),0.2); }
  .skill-category-icon { width: 44px; height: 44px; border-radius: 10px; background: rgba(var(--accent-rgb),0.08); border: 1px solid rgba(var(--accent-rgb),0.15); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--accent); margin-bottom: 1rem; }
  .skill-category h4 { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--heading); margin-bottom: 1rem; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .skill-tag { padding: 0.3rem 0.8rem; background: var(--tint); border: 1px solid var(--border); border-radius: 100px; font-size: 0.78rem; color: var(--text); transition: background 0.2s, border-color 0.2s; }
  .skill-tag:hover { background: rgba(var(--accent-rgb),0.08); border-color: rgba(var(--accent-rgb),0.3); color: var(--accent); }

  /* CERTIFICATIONS */
  
  .certs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; margin-top: 3.5rem; }
  .cert-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.4rem; display: flex; align-items: flex-start; gap: 1rem; transition: transform 0.2s, border-color 0.2s; }
  .cert-card:hover { transform: translateY(-3px); border-color: rgba(var(--accent-rgb),0.25); }
  .cert-icon { width: 42px; height: 42px; flex-shrink: 0; border-radius: 10px; background: rgba(var(--accent2-rgb),0.1); border: 1px solid rgba(var(--accent2-rgb),0.2); display: flex; align-items: center; justify-content: center; color: var(--accent2); font-size: 1rem; }
  .cert-info h4 { font-size: 0.92rem; font-weight: 600; color: var(--heading); line-height: 1.3; }
  .cert-info span { font-size: 0.8rem; color: var(--accent); margin-top: 0.3rem; display: block; }

  /* EDUCATION */
  
  .edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 3.5rem; }
  .edu-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
  .edu-card:hover { transform: translateY(-4px); border-color: rgba(var(--accent-rgb),0.25); }
  .edu-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--gradient); }
  .edu-degree { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--heading); margin-bottom: 0.4rem; }
  .edu-school { color: var(--accent); font-size: 0.9rem; font-weight: 500; }
  .edu-date { color: var(--muted); font-size: 0.82rem; margin-top: 0.4rem; }
  .edu-grade { display: inline-block; margin-top: 1rem; padding: 0.3rem 0.9rem; background: rgba(var(--accent3-rgb),0.08); border: 1px solid rgba(var(--accent3-rgb),0.2); border-radius: 100px; font-size: 0.8rem; color: var(--accent3); }
  .edu-courses { margin-top: 1.2rem; }
  .edu-courses h5 { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
  .edu-course-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .edu-course-tags span { padding: 0.2rem 0.7rem; background: var(--tint); border: 1px solid var(--border); border-radius: 100px; font-size: 0.75rem; color: var(--muted); }

  /* CONTACT */
  
  .contact-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; margin-top: 3.5rem; }
  .contact-text p { color: var(--muted); font-size: 0.98rem; line-height: 1.8; margin-bottom: 2rem; }
  .contact-channels { display: flex; flex-direction: column; gap: 1rem; }
  .contact-channel { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-decoration: none; transition: border-color 0.2s, transform 0.2s; }
  .contact-channel:hover { border-color: rgba(var(--accent-rgb),0.3); transform: translateX(4px); }
  .cc-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(var(--accent-rgb),0.08); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 1rem; flex-shrink: 0; }
  .cc-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .cc-value { color: var(--text); font-size: 0.9rem; font-weight: 500; }
  .contact-form { display: flex; flex-direction: column; gap: 1rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .form-group label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .form-group input, .form-group textarea { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 120px; }
  .form-group input::placeholder, .form-group textarea::placeholder { color: var(--muted); }

  /* FOOTER */
  footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 2rem 5%; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  footer p { font-size: 0.82rem; color: var(--muted); }
  .footer-links { display: flex; gap: 1.5rem; }
  .footer-links a { color: var(--muted); text-decoration: none; font-size: 0.82rem; transition: color 0.2s; }
  .footer-links a:hover { color: var(--accent); }

  /* REVEAL */
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.visible { opacity: 1; transform: none; }

  /* KEYFRAMES */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .hero-inner { grid-template-columns: 1fr; }
    .hero-card { display: none; }
    .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    .skills-grid { grid-template-columns: 1fr 1fr; }
    .edu-grid { grid-template-columns: 1fr; }
    .contact-wrap { grid-template-columns: 1fr; }
    .nav-links, .nav-cta { display: none; }
    .hamburger { display: flex; }
  }
  @media (max-width: 600px) {
    .skills-grid { grid-template-columns: 1fr; }
    .about-highlights { grid-template-columns: 1fr; }
    .hero-stats { gap: 1.5rem; }
  }
  .mobile-menu { display: none; position: fixed; inset: 0; z-index: 99; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; gap: 2rem; }
  .mobile-menu.open { display: flex; }
  .mobile-menu a { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--heading); text-decoration: none; transition: color 0.2s; }
  .mobile-menu a:hover { color: var(--accent); }
  .mobile-menu-close { position: absolute; top: 1.2rem; right: 5%; background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }

  /* PROJECTS */
  
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 3.5rem; }
  .project-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.8rem; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; gap: 0.8rem; }
  .project-card:hover { transform: translateY(-4px); border-color: rgba(var(--accent-rgb),0.25); }
  .project-card h4 { font-family: 'Syne', sans-serif; font-size: 1.05rem; color: var(--heading); }
  .project-card p { font-size: 0.9rem; color: var(--muted); font-weight: 300; }
  .project-link { margin-top: auto; color: var(--accent); font-size: 0.85rem; text-decoration: none; font-weight: 500; }
  .project-link:hover { text-decoration: underline; }

  :root { --accent-rgb: 0,212,255; --accent2-rgb: 0,119,255; --accent3-rgb: 0,255,157; --bg-rgb: 8,9,13; --tint: rgba(255,255,255,0.04); }
  .sec { background: var(--bg); }
  .sec.alt { background: var(--bg2); }
  .hero-inner.single { grid-template-columns: 1fr; max-width: 760px; }
  .about-grid.single { grid-template-columns: 1fr; max-width: 760px; }
  .contact-wrap.single { grid-template-columns: 1fr; max-width: 640px; }
  .hero-card-avatar { overflow: hidden; }
  .hero-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>

  // ---------- export / publish ----------
  function buildHtml() {
    var json = JSON.stringify(D).replace(/</g, '\\u003c');
    var c = document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML = '';
    var ar = c.querySelector('#admin-root'); if (ar) ar.remove();
    c.querySelectorAll('.pubmsg').forEach(function (n) { n.remove(); });
    c.querySelector('#site-data').textContent = json;
    c.querySelector('body').removeAttribute('style'); c.removeAttribute('style');
    return '<!DOCTYPE html>\n' + c.outerHTML;
  }
  $('btn-preview').addEventListener('click', function () { window.open(URL.createObjectURL(new Blob([buildHtml()], { type: 'text/html' })), '_blank'); });
  $('btn-save').addEventListener('click', function () {
    var html = buildHtml(), u = URL.createObjectURL(new Blob([html], { type: 'text/html' })), a = el('a', { href: u, download: 'index.html' });
    document.body.appendChild(a); a.click(); document.body.removeChild(a); dirty = false; setTimeout(function () { URL.revokeObjectURL(u); }, 2000);
  });
  function toast(msg, cls) { var t = el('div', { class: 'pubmsg ' + cls, text: msg }); shadow.appendChild(t); setTimeout(function () { t.remove(); }, cls === 'ok' ? 9000 : 12000); }
  function b64utf8(str) { return btoa(unescape(encodeURIComponent(str))); }
  $('btn-publish').addEventListener('click', function () {
    var c = ghLoad();
    if (!c.repo || !c.token) { toast('Fill in the Publishing connection section at the bottom first.', 'bad'); return; }
    var b = $('btn-publish'); b.disabled = true; b.textContent = 'Publishing…';
    var api = 'https://api.github.com/repos/' + c.repo.trim() + '/contents/' + (c.path || 'index.html').trim().replace(/^\//, '');
    var headers = { 'Authorization': 'Bearer ' + c.token.trim(), 'Accept': 'application/vnd.github+json' }, html = buildHtml();
    fetch(api + '?ref=' + encodeURIComponent(c.branch || 'main'), { headers: headers })
      .then(function (r) { if (r.status === 404) return null; if (!r.ok) throw new Error(r.status === 401 ? 'GitHub rejected the token (401).' : 'Could not read the repository (' + r.status + '). Check the repository name and token permissions.'); return r.json(); })
      .then(function (info) {
        var body = { message: 'Update portfolio content via admin panel', content: b64utf8(html), branch: c.branch || 'main' };
        if (info && info.sha) body.sha = info.sha;
        return fetch(api, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
      })
      .then(function (r) { if (!r.ok) return r.json().then(function (j) { throw new Error('GitHub error ' + r.status + ': ' + (j.message || '')); }); dirty = false; toast('Published. Your site will update in about a minute.', 'ok'); })
      .catch(function (e) { toast(e.message || 'Publish failed.', 'bad'); })
      .then(function () { b.disabled = false; b.textContent = 'Publish to site'; });
  });
  window.addEventListener('beforeunload', function (e) { if (dirty && host.style.display !== 'none') { e.preventDefault(); e.returnValue = ''; } });

  // ---------- login ----------
  function cyrb(str) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++) { var c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return String(4294967296 * (2097151 & h2) + (h1 >>> 0));
  }
  function hashPw(user, pw, salt, algo) {
    var s = salt + '|' + user.toLowerCase() + '|' + pw, canSha = window.crypto && window.crypto.subtle && window.TextEncoder;
    if (algo === 'sha256' && !canSha) return Promise.reject(new Error('This browser cannot verify the password here.'));
    if ((algo === 'sha256' || !algo) && canSha) {
      return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
        return { algo: 'sha256', hash: Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('') };
      });
    }
    return Promise.resolve({ algo: 'basic', hash: cyrb(s) });
  }
  function makeAccount(user, pw) {
    var salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    return hashPw(user, pw, salt).then(function (r) { D.admin = { user: user, salt: salt, algo: r.algo, hash: r.hash }; touch(); });
  }
  function gateSetup() {
    var first = !(D.admin && D.admin.hash);
    $('gate-text').textContent = first ? 'First time here. Create your admin username and password.' : 'Sign in to edit your portfolio.';
    $('g-pw2').classList.toggle('hidden', !first); $('g-btn').textContent = first ? 'Create account' : 'Sign in';
    $('g-err').textContent = ''; $('g-pw').value = ''; $('g-pw2').value = ''; if (!first) $('g-user').value = '';
  }
  function submitGate() {
    var u = $('g-user').value.trim(), p = $('g-pw').value, first = !(D.admin && D.admin.hash), err = $('g-err');
    if (!u || !p) { err.textContent = 'Enter your username and password.'; return; }
    if (first) {
      if (p.length < 8) { err.textContent = 'Use at least 8 characters for the password.'; return; }
      if (p !== $('g-pw2').value) { err.textContent = 'Passwords do not match.'; return; }
      makeAccount(u, p).then(function () { unlocked = true; route(); });
    } else {
      hashPw(u, p, D.admin.salt, D.admin.algo).then(function (r) {
        if (u.toLowerCase() === String(D.admin.user).toLowerCase() && r.hash === D.admin.hash) { unlocked = true; route(); } else { err.textContent = 'Wrong username or password.'; }
      }).catch(function (e) { err.textContent = e.message; });
    }
  }
  $('g-btn').addEventListener('click', submitGate);
  ['g-user', 'g-pw', 'g-pw2'].forEach(function (id) { $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') submitGate(); }); });
  $('g-cancel').addEventListener('click', leaveAdmin);
  $('btn-close').addEventListener('click', function () { if (dirty && !confirm('You have unpublished changes. Close anyway?')) return; unlocked = false; leaveAdmin(); });
  var ADMIN_PATH = /\/admin(\/(index\.html)?)?$/;
  function isAdmin() { return location.hash === '#admin' || ADMIN_PATH.test(location.pathname); }
  function leaveAdmin() {
    try { history.replaceState(null, '', location.pathname.replace(ADMIN_PATH, '/') + location.search); } catch (e) { location.hash = ''; }
    route();
  }
  function route() {
    var on = isAdmin();
    if (on && unlocked) { if (!built) { openEditor(); built = true; } $('gate').classList.add('hidden'); $('editor').classList.remove('hidden'); }
    else if (on) { $('editor').classList.add('hidden'); $('gate').classList.remove('hidden'); gateSetup(); }
    else { unlocked = false; $('editor').classList.add('hidden'); $('gate').classList.add('hidden'); }
    host.style.display = on ? 'block' : 'none'; document.body.style.overflow = on ? 'hidden' : '';
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', route);
  route();
})();
